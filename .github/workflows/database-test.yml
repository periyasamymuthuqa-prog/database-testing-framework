name: Database Automation Tests


on:

  push:

    branches:
      - main


  pull_request:

    branches:
      - main



jobs:


  database-test:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout Repository

      uses: actions/checkout@v4



    - name: Setup Java

      uses: actions/setup-java@v4

      with:

        java-version: '17'

        distribution: 'temurin'



    - name: Execute Database Tests

      run: mvn clean test
